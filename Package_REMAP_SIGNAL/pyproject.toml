[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remap-signal"
version = "0.1.0"
description = "Attach ReMap bigWig signal to human/mouse sequences and build train/dev/test splits"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nimisha Papineni" }]
requires-python = ">=3.8"
dependencies = ["numpy", "pandas", "pyBigWig", "scikit-learn", "tqdm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/NPAPINENI/Package_REMAP_SIGNAL"

[project.scripts]
remap-signal = "remap_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
